name: docs-ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Internal link check
        run: python3 tools/check_links.py
      - name: Jargon scan (no task ids in headings)
        run: |
          if grep -rnE '^#{1,3} .*\((T-[0-9]+|Phase [0-9]+)\)' --include='*.md' . | grep -v '^\./legacy/'; then
            echo "Heading contains task-jargon"
            exit 1
          fi
      - name: llms.txt entries resolve
        run: python3 tools/check_links.py && true